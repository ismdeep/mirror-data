name: Update Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '24 0 * * *'
  workflow_dispatch:
    inputs:
      should_run_for_all_pages:
        description: Check all pages for every repository
        type: boolean
        default: false
        required: false
      should_update_data:
        description: Update data
        type: boolean
        default: true
        required: false
      should_publish_docker_images:
        description: Publish docker images
        type: boolean
        default: true
        required: false

permissions:
  contents: write
  packages: write

jobs:
  update-data:

    runs-on: ubuntu-26.04

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_TAG: latest
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      SHOULD_RUN_FOR_ALL_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.should_run_for_all_pages || false }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set env
        if: env.BRANCH_NAME != 'main'
        run: echo "IMAGE_TAG=$(echo ${BRANCH_NAME} | tr / - | tr \# - )" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install rclone
        run: sudo make install-rclone

      - name: Build
        run: make build-binary

      - name: Prepare secrets
        if: ${{ inputs.should_update_data }}
        run: echo "${{ secrets.SECRETS_YAML }}" > secrets.yaml

      - name: Run mirror-data
        if: ${{ inputs.should_update_data }}
        run: ./build/binary/data --meta _meta.yaml --secrets secrets.yaml --all-pages="${SHOULD_RUN_FOR_ALL_PAGES}"

      - name: Set up QEMU
        if: ${{ inputs.should_publish_docker_images }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ inputs.should_publish_docker_images }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.should_publish_docker_images }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        if: ${{ inputs.should_publish_docker_images }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/app/mirror
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        if: ${{ inputs.should_publish_docker_images }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker.mirror.dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push back
        if: env.BRANCH_NAME == 'main'
        run: make publish
